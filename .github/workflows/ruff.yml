name: Lint

on:
  push:
    branches: [ "main", "facct_submission" ]
  pull_request:
    branches: [ "main", "facct_submission" ]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Run Ruff
        run: uv run ruff check .
