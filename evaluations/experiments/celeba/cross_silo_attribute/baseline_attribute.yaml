program:  ../../../puffle/main.py
method: bayes
metric:
  name: Custom_metric
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 5
parameters:
  epochs:
    min: 1
    max: 5
  batch_size:
    min: 128
    max: 512
  lr:
    min: 0.0001
    max: 0.1
  optimizer:
    values: ["adam", "sgd"]

command:
  - ${env}
  - uv 
  - run 
  - python
  - ${program}
  - ${args}
  - --dataset
  - celeba_prepared
  - --num_rounds
  - 39
  - --num_client_cpus
  - 1
  - --num_client_gpus
  - 0.05
  - --pool_size
  - 50
  - --sampled_clients 
  - 0.2
  - --sampled_clients_test 
  - 0
  - --sampled_clients_validation 
  - 0.5
  - --debug
  - True
  - --base_path
  - ../../../../datasets/celeba/cross_silo_attribute/medium/federated/
  - --dataset_path 
  - ../../../../datasets/celeba/cross_silo_attribute/medium/
  - --seed 
  - 41 
  - --wandb 
  - True 
  - --sweep
  - True
  - --training_nodes 
  - 0.6
  - --validation_nodes 
  - 0.20
  - --test_nodes 
  - 0.20
  - --tabular_data 
  - True
  - --metric
  - disparity
  - --splitted_data_dir
  - federated
  - --ratio_unfair_nodes 
  - 0.5
  - --cross_silo
  - True